AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.4
  Exclude:
    - build/**/*
    - tmp/**/*
    - vendor/**/*

Style/Documentation:
  Enabled: false

# A file reads as one step of the pipeline, so the C libraries it binds sit beside the class that uses them.
Style/OneClassPerFile:
  Enabled: false
